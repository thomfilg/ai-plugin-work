name: Attribution

# The last enforcement point, and the only one that cannot be routed around.
#
# The plugin's hooks run where the agent runs, and the git hooks run where they
# are installed. Neither covers a branch pushed from a laptop that has neither,
# and neither covers the pull request's own description, which is written on
# github.com. This job asks the same questions of what actually arrived.

on:
  pull_request:
    branches: [main]
    # `edited` is not in the default set, and this job reads the title and the
    # body — without it, a description that gains a footer after the pull
    # request was opened is never checked again, and one that is corrected
    # stays red. Both happened on the run that introduced this file.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  ghostwriter:
    runs-on: ubuntu-latest
    name: No AI self-attribution
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: every check below is a range against the base.
          fetch-depth: 0

      # No setup-node step on purpose. The scanner is plain CommonJS over
      # node:fs, node:path and node:child_process with no dependencies and no
      # install, so the runner's preinstalled node runs it — and every action
      # this job does not use is one whose code cannot change underneath it.
      # (Review on #785 asked for both actions to be pinned to commit SHAs.
      # Removing one is the half of that which does not need a SHA looked up;
      # pinning `checkout` is worth doing across all four workflows in this
      # repository at once, rather than here alone.)

      - name: Resolve the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          if [ -z "$BASE" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # The checker must not be the thing being checked. Run from the
      # pull-request tree, a change that weakens the scanner — or any module it
      # loads — makes its own check pass, which is the one property a final
      # gate cannot have. So the code comes from the BASE revision, applied to
      # the pull request's content, which `--repo` already supports.
      #
      # The fallback is for exactly one pull request: the one that introduces
      # the scanner, where the base has none to borrow. That case is visible in
      # the log rather than silent.
      - name: Take the checker from the base revision
        id: checker
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE"
          if git cat-file -e "$BASE:plugins/ghostwriter/scripts/ghostwriter-scan.js" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE" >/dev/null
            DIR="$RUNNER_TEMP/base"
            echo "Enforcing with the checker at $BASE."
          else
            echo "The base revision has no checker, so this one enforces itself."
            echo "That is true only of the pull request that introduces it."
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Files this pull request adds
        run: |
          node "${{ steps.checker.outputs.dir }}/plugins/ghostwriter/scripts/ghostwriter-scan.js" \
            --repo "$GITHUB_WORKSPACE" --diff "${{ steps.base.outputs.sha }}"

      - name: Commits this pull request adds — message and author
        run: |
          node "${{ steps.checker.outputs.dir }}/plugins/ghostwriter/scripts/ghostwriter-scan.js" \
            --repo "$GITHUB_WORKSPACE" --commits "${{ steps.base.outputs.sha }}"

      - name: The pull request's own title and description
        # Via env, never interpolated into the script: the title and body are
        # written by whoever opened the pull request, and a `run:` block that
        # substitutes them at template time executes what they wrote.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
            node "${{ steps.checker.outputs.dir }}/plugins/ghostwriter/scripts/ghostwriter-check.js" --prose -
